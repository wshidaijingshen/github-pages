<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 GitHub Pages 网站</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #6a7bad;
            color: white;
            text-align: center;
            padding: 1em 0;
        }
        nav {
            display: flex;
            justify-content: space-around;
            background-color: #eaeaea;
            padding: 0.5em 0;
        }
        nav a {
            color: black;
            text-decoration: none;
            padding: 0.5em 1em;
        }
        nav a:hover {
            background-color: #ddd;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        footer {
            text-align: center;
            padding: 1em 0;
            background-color: #6a7bad;
            color: white;
        }
    </style>
</head>
<body>

<header>
    <h1>欢迎来到我的 GitHub Pages 网站</h1>
</header>

<nav>
    <a href="#home">首页</a>
    <a href="#about">关于我</a>
    <a href="#contact">联系我</a>
</nav>

<div class="container">

    <section id="home">
        <h2>首页</h2>
        <p>这是一个简单的 GitHub Pages 网站示例。</p>
        <img src="images/sample-image.jpg" alt="样本图片" style="max-width: 100%; height: auto;">
    </section>

    <section id="about">
        <h2>关于我</h2>
        <p>这里是一些关于我的介绍...</p>
    </section>

    <section id="contact">
        <h2>联系我</h2>
        <form action="#" method="post">
            <label for="name">姓名:</label><br>
            <input type="text" id="name" name="name"><br>
            <label for="email">电子邮件:</label><br>
            <input type="email" id="email" name="email"><br>
            <label for="message">消息:</label><br>
            <textarea id="message" name="message"></textarea><br>
            <button type="submit">发送</button>
        </form>
    </section>

</div>

<footer>
    &copy; 2023 我的名字. 版权所有.
</footer>

</body>
</html>
